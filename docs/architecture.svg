  <g transform="translate(0,-70)">

  <text x="30" y="112" font-size="20" font-weight="700" fill="#111">Open-Meteo &#8594; SeaweedFS &#8594; DuckDB &#8594; Streamlit</text>
  <text x="30" y="134" font-size="13" font-style="italic" fill="#666">Prefect orchestration &#183; SeaweedFS (S3-compatible) storage &#183; DuckDB httpfs query</text>

